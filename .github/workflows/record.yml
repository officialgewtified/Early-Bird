name: Early Bird record
# Every hour: write down what Early Bird's Fresh list shows, and re-check older coins at 1, 6 and 24 hours,
# so the site's Record tab can show how each kind of coin really did. Free data only; no keys or credits.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: early-bird-record
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node track.js
      - run: |
          git config user.name "earlybird-bot"
          git config user.email "earlybird-bot@users.noreply.github.com"
          git add history.json
          git diff --staged --quiet && exit 0
          git commit -m "Early Bird record"
          for i in 1 2 3; do git pull --rebase origin ${{ github.ref_name }} && git push && exit 0; sleep 10; done
          exit 1
